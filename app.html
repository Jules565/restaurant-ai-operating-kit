function prof(){let fs=[['name','Restaurant name'],['location','Location'],['cuisine','Type of cuisine'],['concept','Concept'],['audience','Target customers'],['price','Price range'],['hours','Opening hours'],['dishes','Main / best-selling dishes'],['signature','Signature dishes'],['tone','Brand personality / tone'],['usp','Unique selling points'],['channels','Marketing channels'],['challenges','Current challenges'],['objectives','Current objectives'],['events','Upcoming events / promotions'],['restrictions','Important restrictions / context']];C.innerHTML=`<div class="hero"><div><div class="ey">One-time setup</div><h1>Restaurant Profile</h1><p>Complete this once. It will be injected into prompts.</p></div></div><div class="card"><div class="profile">${fs.map(f=>`<div><label>${f[1]}</label><input id="p_${f[0]}" value="${esc(restaurantProfile[f[0]]||'')}"></div>`).join('')}</div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="saveProf()">Save profile</button><button class="btn" onclick="restaurantProfile={};save();prof()">Clear</button></div></div>`}function saveProf(){restaurantProfile={};document.querySelectorAll('[id^=p_]').forEach(x=>restaurantProfile[x.id.slice(2)]=x.value.trim());save();alert('Profile saved. Your prompts are now contextualized.');}
function cheat(){C.innerHTML=`<div class="hero"><div><div class="ey">Fast reference</div><h1>Prompt Cheat Sheet</h1><p>The original kit's core prompting rules, made accessible without leaving the app.</p></div></div><div class="grid"><div class="card"><h3>Give context</h3><p class="muted">Use the Restaurant Profile plus current facts, dates, offers, feedback and constraints.</p></div><div class="card"><h3>Use constraints</h3><p class="muted">Tell AI what it must respect and what it must not invent.</p></div><div class="card"><h3>Request a deliverable</h3><p class="muted">Ask for a concrete draft, plan, checklist, table or ready-to-copy text.</p></div><div class="card"><h3>Refine</h3><p class="muted">Ask for alternatives, a different tone, a shorter version or the missing questions.</p></div><div class="card"><h3>Separate facts from assumptions</h3><p class="muted">Especially for business, pricing, customer behavior and operational decisions.</p></div><div class="card"><h3>5-minute AI rule</h3><p class="muted">Use AI for one concrete task at a time, review the output and take one real-world action.</p></div></div>`}
go('dash');</script></body></html>
